[project]
name = "analyzer"
version = "0.1.0"
description = "Greenlight analysis worker: preflight, contract extraction, brand mentions."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "boto3>=1.43.100",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "google-genai>=2.25.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-docx>=1.2.0",
    "rapidocr-onnxruntime>=1.4.4",
    "scenedetect>=0.6.4",
    "uvicorn>=0.32",
    "webrtcvad-wheels>=2.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
# rapidocr depends on the GUI build of OpenCV; both builds install the same
# `cv2` module and clobber each other. Keep only the headless one.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
