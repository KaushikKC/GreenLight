[project]
name = "analyzer"
version = "0.1.0"
description = "Greenlight analysis worker: preflight, contract extraction, brand mentions."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"
